<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="工程小管家研发工程部协作平台">
  <meta name="theme-color" content="#152247">
  <title>工程小管家</title>
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <main id="auth-view" class="auth-page" hidden>
    <section class="auth-brand">
      <div class="brand"><span class="brand-mark">工</span><span>工程小管家</span></div>
      <div class="auth-intro">
        <h1>研发工程部<br>协作工作台</h1>
        <p>集中跟进任务、需求和团队投入。</p>
        <div class="auth-flow" aria-hidden="true">
          <span><i class="dot dot-plan"></i>待规划</span>
          <span><i class="dot dot-start"></i>开发中</span>
          <span><i class="dot dot-test"></i>测试中</span>
          <span><i class="dot dot-done"></i>已完成</span>
        </div>
      </div>
    </section>
    <section class="auth-panel" aria-label="账号登录">
      <div class="auth-inner">
        <div class="auth-tabs" id="auth-tabs" hidden>
          <button type="button" class="auth-tab active" data-auth="login">账号登录</button>
          <button type="button" class="auth-tab" data-auth="register">注册成员</button>
        </div>
        <h2 id="auth-title">登录工作台</h2>
        <form id="auth-form">
          <label>账号<input name="account" autocomplete="username" placeholder="请输入工号或用户名" required></label>
          <label id="auth-name" hidden>姓名<input name="name" autocomplete="name" placeholder="请输入姓名" disabled></label>
          <label>密码<input name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required></label>
          <p id="auth-error" class="form-error" role="alert" hidden></p>
          <button class="button primary auth-submit" type="submit" id="auth-submit">登录</button>
        </form>
      </div>
    </section>
  </main>

  <div id="loading-view" class="loading-view" role="status">正在连接工程小管家…</div>

  <div id="workspace" class="workspace" hidden>
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">工</span><span>工程小管家<small>研发工程部</small></span></div>
      <nav aria-label="主导航">
        <button class="nav-item" data-page="home"><span class="nav-icon" aria-hidden="true">▦</span>工作台</button>
        <button class="nav-item" data-page="tasks"><span class="nav-icon" aria-hidden="true">☷</span>任务中心</button>
        <button class="nav-item" data-page="demands"><span class="nav-icon" aria-hidden="true">◇</span>需求管理</button>
        <button class="nav-item" data-page="people"><span class="nav-icon" aria-hidden="true">◎</span>人员管理</button>
        <button class="nav-item" data-page="board"><span class="nav-icon" aria-hidden="true">▥</span>数据看板</button>
        <button class="nav-item" data-page="account"><span class="nav-icon" aria-hidden="true">◉</span>我的账号</button>
        <button class="nav-item" data-page="projects" hidden><span class="nav-icon" aria-hidden="true">▣</span>项目管理</button>
        <button class="nav-item" data-page="demandCatalog" hidden><span class="nav-icon" aria-hidden="true">▤</span>基础配置</button>
      </nav>
      <div class="sidebar-resources">
        <button type="button" class="sidebar-reference" data-page="guidelines"><span class="sidebar-reference-icon" aria-hidden="true"></span>行为规范</button>
      </div>
      <div class="sidebar-footer">
        <span id="avatar" class="avatar"></span>
        <span class="sidebar-user"><strong id="user-name"></strong><small id="user-role"></small></span>
        <button type="button" class="signout" data-action="logout">退出</button>
      </div>
    </aside>
    <main class="workspace-main">
      <header class="topbar"><span>研发工程部</span><time id="today"></time></header>
      <section id="content" class="content" aria-live="polite"></section>
    </main>
  </div>

  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <dialog id="task-transfer-dialog" aria-labelledby="task-transfer-title">
    <div class="dialog-heading"><div class="dialog-heading-text">
      <h2 id="task-transfer-title">确定转交负责人？</h2>
      <p id="task-transfer-summary" class="muted text-small"></p>
    </div></div>
    <dl class="task-form-facts"><dt>接手人</dt><dd id="task-transfer-recipient"></dd></dl>
    <form method="dialog" class="dialog-actions">
      <button class="button" value="cancel" autofocus>取消</button>
      <button class="button primary" value="transfer">确定转交</button>
    </form>
  </dialog>
  <dialog id="task-start-dialog" aria-labelledby="task-start-title" aria-describedby="task-start-note">
    <div class="dialog-heading">
      <h2 id="task-start-title">开始规划</h2>
      <div class="dialog-priority"><span>优先级</span><span id="task-start-priority"></span></div>
    </div>
    <form method="dialog">
      <p id="task-start-note">确认后，任务将进入开发中。开始时间、计划投入工时和计划完成时间会锁定。</p>
      <dl class="form-grid task-form-facts task-schedule-summary">
        <div><dt>开始时间</dt><dd id="task-start-time"></dd></div>
        <div><dt>计划完成时间</dt><dd id="task-start-due" aria-live="polite"></dd></div>
      </dl>
      <div class="plan-hours-field">
        <label for="plan-hours">计划投入工时（小时，必填）</label>
        <div class="plan-hours-control">
          <input id="plan-hours" name="plan_hours" type="number" min="0.01" step="0.01" required autofocus>
          <div class="plan-hours-arrows">
            <button type="button" data-plan-step="1" aria-label="增加 1 小时">▴</button>
            <button type="button" data-plan-step="-1" aria-label="减少 1 小时">▾</button>
          </div>
        </div>
      </div>
      <div class="dialog-actions">
        <button type="button" class="button" data-start-cancel>取消</button>
        <button type="submit" class="button primary" value="start">确定开始</button>
      </div>
    </form>
  </dialog>
  <dialog id="task-complete-dialog" aria-labelledby="task-complete-title" aria-describedby="task-complete-note">
    <div class="dialog-heading"><h2 id="task-complete-title">确定完成任务？</h2></div>
    <form method="dialog">
      <p id="task-complete-note">确认后，任务将标记为已完成，任务内容将锁定。</p>
      <label>完成结果（必填）<textarea name="result" rows="3" maxlength="10000" required autofocus></textarea></label>
      <label>投入工时（小时，必填）<input name="hours" type="number" min="0" step="any" required></label>
      <div class="dialog-actions">
        <button type="button" class="button" data-completion-cancel>取消</button>
        <button type="submit" class="button primary" value="complete">确定完成</button>
      </div>
    </form>
  </dialog>
  <dialog id="guidelines-dialog" class="guidelines-dialog" aria-labelledby="guidelines-dialog-title" closedby="none">
    <header class="guidelines-dialog-header"><h2 id="guidelines-dialog-title" tabindex="-1" autofocus>工程部员工作业流程及行为规范</h2></header>
    <div id="guidelines-dialog-body" class="guidelines-dialog-body" tabindex="0" role="region" aria-label="行为规范正文"></div>
    <footer class="guidelines-dialog-footer">
      <p id="guidelines-scroll-hint" class="muted text-small" role="status" hidden>请滚动到正文底部后确认。</p>
      <p id="guidelines-confirm-error" class="form-error" role="alert" hidden></p>
      <button id="confirm-guidelines" class="button primary" type="button" disabled>确认</button>
    </footer>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
